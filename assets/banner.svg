<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#2a0f4d;#0b2447;#0f0c29" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#6a1b9a;#144272;#302b63" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#0b3d5c;#3a1c71;#24243e" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="0.5" y2="0" spreadMethod="reflect">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="25%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#ffd600"/>
      <stop offset="75%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00f5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.5 0" to="0.5 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#ffd600"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- animated sorting bars -->
    <g opacity="0.55">
      <g transform="translate(40,320) scale(1,-1)"><rect width="30" height="40" fill="#00f5ff"><animate attributeName="height" values="30;110;60;30" dur="3.1s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(110,320) scale(1,-1)"><rect width="30" height="80" fill="#ff6ec7"><animate attributeName="height" values="90;40;120;90" dur="2.7s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(180,320) scale(1,-1)"><rect width="30" height="60" fill="#ffd600"><animate attributeName="height" values="50;130;70;50" dur="3.5s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(250,320) scale(1,-1)"><rect width="30" height="100" fill="#00e676"><animate attributeName="height" values="100;50;90;100" dur="2.9s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(320,320) scale(1,-1)"><rect width="30" height="50" fill="#2979ff"><animate attributeName="height" values="40;120;80;40" dur="3.3s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(390,320) scale(1,-1)"><rect width="30" height="90" fill="#d500f9"><animate attributeName="height" values="80;30;110;80" dur="2.6s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(460,320) scale(1,-1)"><rect width="30" height="70" fill="#ff9100"><animate attributeName="height" values="60;115;45;60" dur="3.7s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(530,320) scale(1,-1)"><rect width="30" height="45" fill="#00f5ff"><animate attributeName="height" values="45;100;70;45" dur="2.8s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(600,320) scale(1,-1)"><rect width="30" height="95" fill="#ff6ec7"><animate attributeName="height" values="95;35;125;95" dur="3.2s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(670,320) scale(1,-1)"><rect width="30" height="55" fill="#ffd600"><animate attributeName="height" values="55;120;65;55" dur="3.0s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(740,320) scale(1,-1)"><rect width="30" height="85" fill="#00e676"><animate attributeName="height" values="85;45;105;85" dur="2.5s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(810,320) scale(1,-1)"><rect width="30" height="65" fill="#2979ff"><animate attributeName="height" values="65;125;50;65" dur="3.6s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(880,320) scale(1,-1)"><rect width="30" height="105" fill="#d500f9"><animate attributeName="height" values="105;55;85;105" dur="2.9s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(950,320) scale(1,-1)"><rect width="30" height="48" fill="#ff9100"><animate attributeName="height" values="48;110;75;48" dur="3.4s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(1020,320) scale(1,-1)"><rect width="30" height="88" fill="#00f5ff"><animate attributeName="height" values="88;38;118;88" dur="2.7s" repeatCount="indefinite"/></rect></g>
      <g transform="translate(1090,320) scale(1,-1)"><rect width="30" height="62" fill="#ff6ec7"><animate attributeName="height" values="62;122;52;62" dur="3.3s" repeatCount="indefinite"/></rect></g>
    </g>

    <!-- floating code symbols -->
    <g font-family="Consolas, 'Courier New', monospace" font-weight="bold" opacity="0.4">
      <text x="70" font-size="28" fill="#00f5ff">{ }<animate attributeName="y" from="340" to="-30" dur="9s" begin="-2s" repeatCount="indefinite"/></text>
      <text x="190" font-size="24" fill="#ff6ec7">[ ]<animate attributeName="y" from="340" to="-30" dur="12s" begin="-7s" repeatCount="indefinite"/></text>
      <text x="300" font-size="26" fill="#00e676">0<animate attributeName="y" from="340" to="-30" dur="8s" begin="-3s" repeatCount="indefinite"/></text>
      <text x="410" font-size="26" fill="#ffd600">1<animate attributeName="y" from="340" to="-30" dur="10s" begin="-6s" repeatCount="indefinite"/></text>
      <text x="520" font-size="24" fill="#2979ff">-&gt;<animate attributeName="y" from="340" to="-30" dur="11s" begin="-1s" repeatCount="indefinite"/></text>
      <text x="640" font-size="26" fill="#ff9100">O(n)<animate attributeName="y" from="340" to="-30" dur="13s" begin="-9s" repeatCount="indefinite"/></text>
      <text x="760" font-size="28" fill="#d500f9">&lt;/&gt;<animate attributeName="y" from="340" to="-30" dur="9.5s" begin="-4s" repeatCount="indefinite"/></text>
      <text x="880" font-size="26" fill="#00f5ff">;<animate attributeName="y" from="340" to="-30" dur="8.5s" begin="-5s" repeatCount="indefinite"/></text>
      <text x="970" font-size="26" fill="#ff6ec7">#<animate attributeName="y" from="340" to="-30" dur="12.5s" begin="-8s" repeatCount="indefinite"/></text>
      <text x="1060" font-size="24" fill="#00e676">log n<animate attributeName="y" from="340" to="-30" dur="10.5s" begin="0s" repeatCount="indefinite"/></text>
      <text x="1140" font-size="28" fill="#ffd600">*<animate attributeName="y" from="340" to="-30" dur="9s" begin="-6s" repeatCount="indefinite"/></text>
    </g>

    <!-- scanning light beam -->
    <rect y="0" width="4" height="320" fill="#00f5ff" opacity="0.35">
      <animate attributeName="x" from="-10" to="1210" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- title -->
    <text x="600" y="150" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="6" fill="url(#title)" filter="url(#glow)">DSA LAB VAULT
      <animate attributeName="letter-spacing" values="6;11;6" dur="4s" repeatCount="indefinite"/>
    </text>

    <!-- subtitle -->
    <text x="600" y="205" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#e3e9ff">Think  &#8226;  Code  &#8226;  Debug  &#8226;  Optimize
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/>
    </text>

    <!-- pulsing dots -->
    <circle cx="540" cy="238" r="5" fill="#00f5ff"><animate attributeName="r" values="3;7;3" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="238" r="5" fill="#ff6ec7"><animate attributeName="r" values="3;7;3" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="238" r="5" fill="#ffd600"><animate attributeName="r" values="3;7;3" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="2" y="2" width="1196" height="316" rx="23" fill="none" stroke="url(#border)" stroke-width="3" opacity="0.8"/>
</svg>
